name: Tests e imagen ARM64

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "Dockerfile", "requirements.txt", "docker-compose.prod.yml", "deploy/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: bash -n deploy/setup-oracle.sh && bash -n deploy/migrate-data.sh && bash -n start.sh

  docker-arm64:
    # Oracle Cloud Always Free usa servidores Ampere (ARM64): se compila la imagen para esa arquitectura
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t escuadron:ci .
      - name: Validar docker-compose de producción
        run: touch .env && DOMAIN=ci.example.com docker compose -f docker-compose.prod.yml config --quiet
      - name: Arranque de humo (la API debe responder)
        run: |
          docker run -d --name smoke -e API_TOKEN=ci -e REQUIRE_API_TOKEN=1 -p 8000:8000 escuadron:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/portfolio)" = "401"
          docker logs smoke | tail -20
